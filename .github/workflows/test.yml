name: Test

on:
  push:
    branches: ["main"]
  # MOO-71: no base filter. This previously only ran for PRs targeting `main`,
  # so a stacked PR (one opened against another in-review branch, which is how
  # this project sequences dependent commits -- see MOO-71 Stage 1 and Stage 4)
  # reported no checks at all and had to be verified by hand. Running on every
  # pull request costs nothing here and means a stacked PR is verified before
  # it is rebased onto main rather than after.
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyan3
        run: pip install pyan3==2.6.2

      - name: Production build
        run: npm run build

      - name: Run test suite
        run: node --test tests/*.test.mjs

      # Structural smoke uses the same read-only server credential as the
      # browser acceptance below. The credential is never sent by the UI.
      - name: Run server smoke test
        run: node tests/server-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run e2e construction smoke test
        run: node tests/e2e-construction-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Run dev and built browser acceptance
        run: node scripts/browser-acceptance.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          include-hidden-files: true
          path: |
            .git/browser-acceptance/
            .git/run2-browser.json
            .git/run2-lane28-*.png
            docs/img/smoke-*.png
          retention-days: 7
